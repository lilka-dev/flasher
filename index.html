<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilka Flasher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="./">
                <img src="https://docs.lilka.dev/uk/latest/_static/lilka_logo.png" alt="" onerror="this.remove()">
                <span>Lilka Flasher</span>
            </a>
            <div class="language-switch" role="group" aria-label="Language">
                <button class="lang-btn" type="button" data-lang="uk">УК</button>
                <button class="lang-btn" type="button" data-lang="en">EN</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1 data-i18n="heroTitle"></h1>
            <p class="subtitle" data-i18n="subtitle"></p>
        </section>

        <div class="alert alert-warning" id="browserWarning" hidden></div>

        <ol class="steps">
            <li data-i18n="step1"></li>
            <li data-i18n="step2"></li>
            <li data-i18n="step3"></li>
        </ol>
        <p class="hint" data-i18n-html="note"></p>

        <section class="section">
            <h2 data-i18n="releasesTitle"></h2>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p data-i18n="loading"></p>
            </div>
            <div class="releases-list" id="releasesList"></div>
        </section>

        <section class="section danger-zone">
            <div>
                <h2 data-i18n="eraseTitle"></h2>
                <p data-i18n="eraseDescription"></p>
            </div>
            <button class="btn btn-danger" id="eraseBtn" type="button" data-i18n="eraseBtn"></button>
            <div class="task" id="eraseTask" hidden>
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <p class="progress-text"></p>
                <div class="flash-log"></div>
            </div>
        </section>
    </main>

    <footer>
        <a href="https://lilka.dev" target="_blank" rel="noopener">lilka.dev</a>
        <a href="https://github.com/lilka-dev/" target="_blank" rel="noopener">GitHub</a>
        <a href="https://docs.lilka.dev" target="_blank" rel="noopener">Docs</a>
    </footer>

    <dialog class="modal" id="flashModal">
        <div class="modal-header">
            <h3><span data-i18n="modalTitle"></span> <span class="modal-version" id="flashVersion"></span></h3>
            <button class="modal-close" type="button" data-action="close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
            <p class="step-label" id="firmwareLabel"></p>
            <div class="firmware-options" id="firmwareOptions"></div>

            <div id="manualFile">
                <p class="step-label" data-i18n="manualStep2"></p>
                <label class="file-input">
                    <input type="file" id="firmwareFile" accept=".bin">
                    <span id="fileInputText"></span>
                </label>
            </div>

            <div class="task" id="flashTask" hidden>
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <p class="progress-text"></p>
                <div class="flash-log"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" data-action="close" id="cancelBtn"></button>
            <button class="btn btn-primary" type="button" id="flashBtn"></button>
        </div>
    </dialog>

    <script type="importmap">
    {
        "imports": {
            "pako": "https://cdn.jsdelivr.net/npm/pako@2.1.0/+esm"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
